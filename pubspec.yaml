name: virus_all_downloader
description: "Virus All Downloader-Multi-platform video downloader."
publish_to: 'none'
version: 2.9.0+108
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  background_downloader: ^8.5.0
  video_player: ^2.9.2
  chewie: ^1.8.5
