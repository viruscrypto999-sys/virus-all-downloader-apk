name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk Virus-All-Downloader.apk
          mv app-armeabi-v7a-release.apk Virus-All-Downloader-armv7.apk
          mv app-x86_64-release.apk Virus-All-Downloader-x86_64.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: Virus All Downloader v1.0.5
          files: |
            build/app/outputs/flutter-apk/Virus-All-Downloader-armv7.apk
            build/app/outputs/flutter-apk/Virus-All-Downloader.apk
            build/app/outputs/flutter-apk/Virus-All-Downloader-x86_64.apk
